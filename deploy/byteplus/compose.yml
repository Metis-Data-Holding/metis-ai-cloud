name: metis-ai-cloud

x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  app:
    image: ${METIS_IMAGE:?METIS_IMAGE must be set in the release environment file}
    pull_policy: never
    restart: unless-stopped
    init: true
    command: --log-dir /app/logs
    env_file:
      - /etc/metis-ai-cloud/app.env
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - /data/metis-ai-cloud/shared/app-data:/data
      - /data/metis-ai-cloud/shared/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:3000/api/status | grep -q '"success"[[:space:]]*:[[:space:]]*true'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging
    networks:
      - internal

  postgres:
    image: postgres:15-alpine
    pull_policy: missing
    restart: unless-stopped
    env_file:
      - /etc/metis-ai-cloud/postgres.env
    volumes:
      - /data/metis-ai-cloud/shared/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U metis -d metis]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    networks:
      - internal

  redis:
    image: redis:7-alpine
    pull_policy: missing
    restart: unless-stopped
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    volumes:
      - /data/metis-ai-cloud/shared/redis:/data
      - /etc/metis-ai-cloud/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$(sed -n 's/^requirepass[[:space:]]\+//p' /usr/local/etc/redis/redis.conf) redis-cli --no-auth-warning ping | grep -q '^PONG$$'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    networks:
      - internal

networks:
  internal:
    driver: bridge
