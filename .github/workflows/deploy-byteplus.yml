name: Deploy BytePlus ECS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or full commit to verify, build, and deploy
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-byteplus-metis-ai-cloud
  cancel-in-progress: false

jobs:
  build:
    name: Verify and publish linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      image: ${{ steps.release.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out selected ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Resolve immutable release identity
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'commit=%s\n' "$commit" >>"$GITHUB_OUTPUT"
          printf 'image=ghcr.io/%s\n' "$repository" >>"$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Verify backend
        env:
          GOWORK: 'off'
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
          go vet ./...
          (cd relaykit && go vet ./...)
          make test

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Verify frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.commit }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    name: Activate immutable release
    needs: build
    runs-on: [self-hosted, Linux, X64, byteplus-hk, metis-ai-cloud, deploy]
    timeout-minutes: 15
    environment:
      name: byteplus-demo
      url: https://many-models.metisdata.ai
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy through restricted release command
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          IMAGE_NAME: ${{ needs.build.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          printf '%s\n' "$GHCR_TOKEN" \
            | sudo /usr/local/sbin/metis-ai-cloud-release \
                deploy "$RELEASE_COMMIT" "$image_ref" "$GITHUB_ACTOR"

      - name: Verify public HTTPS
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --max-time 15 https://many-models.metisdata.ai/api/status \
            | grep -q '"success"[[:space:]]*:[[:space:]]*true'
          sudo /usr/local/sbin/metis-ai-cloud-release status
